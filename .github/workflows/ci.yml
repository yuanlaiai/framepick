name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linter
        run: pip install ruff

      - name: Lint
        run: ruff check app

      - name: Compile
        run: python -m compileall -q app

      - name: Import pure modules
        run: python -c "from app import textproc, platforms; print('ok')"
