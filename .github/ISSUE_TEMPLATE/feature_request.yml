name: 功能建议
description: 新平台、新导出格式、体验改进
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 你希望的方案
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - 平台解析
        - 素材下载
        - 语音转写
        - 文案整理 / 导出
        - 界面
        - 部署 / 打包
        - 其他
